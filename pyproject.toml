[project]
name = "leasure"
version = "0.1.0"
description = "Music downloader and MP3 player sync for HIFI WALKER H2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.7",
    "spotipy>=2.24",
    "ytmusicapi>=1.9",
    "Pillow>=12.1.1",
    "mutagen>=1.47",
    "httpx>=0.28",
    "yt-dlp>=2025.3",
]

[project.scripts]
leasure = "app:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["docs", ".design-sync", "static", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # long lines in templates-as-strings; Depends() defaults are FastAPI idiom

[tool.ruff.lint.isort]
known-first-party = ["routers", "services", "app", "config", "db", "models", "worker"]
